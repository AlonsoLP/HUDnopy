name: CI Build & Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check Web HUD & Docs JavaScript syntax
        shell: pwsh
        run: |
          node --check Web/app.js
          node --check docs/i18n.js
          node --check docs/app.js

      - name: Build HUDnopy (Release)
        shell: pwsh
        run: dotnet build HUDnopy.csproj -c Release

      - name: Run HUDnopy.Tests
        shell: pwsh
        run: dotnet run --project HUDnopy.Tests/HUDnopy.Tests.csproj -c Release
