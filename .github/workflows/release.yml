name: Build and Release HUDnopy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $version = $tag.TrimStart('v')
          $isPrerelease = ($version -match '-').ToString().ToLowerInvariant()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building HUDnopy tag=$tag version=$version prerelease=$isPrerelease"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Check Web HUD JavaScript syntax
        shell: pwsh
        run: node --check Web/app.js

      - name: Run HUDnopy automated tests
        shell: pwsh
        run: dotnet run --project HUDnopy.Tests/HUDnopy.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 binary
        shell: pwsh
        run: |
          dotnet publish HUDnopy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:InformationalVersion=${{ steps.meta.outputs.version }} `
            -o publish/win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zipPath -Force

      - name: Ensure Inno Setup 6 is available and build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.meta.outputs.version }}" `
            "/DMyAppTag=${{ steps.meta.outputs.tag }}" `
            "/DPublishDir=..\publish\win-x64" `
            "installer\HUDnopy.iss"
          Copy-Item "installer\Output\HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe" "dist\" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist\*" -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $prereleaseBanner = ""
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            $prereleaseBanner = @'
          > [!WARNING]
          > **Pre-release Notice:** This is an early testing build (`__TAG__`) under active development and is **not yet a final stable release**. Features, configuration formats, and UI layouts may change in upcoming updates. Bug reports and feedback are greatly appreciated!

          '@
          }

          $notes = @'
          ## HUDnopy __TAG__

          __BANNER__### Highlights
          - **8-Tab Desktop & Web HUD Parity:** Reorganized into 8 focused desktop tabs (7 in Web MFD, plus Split MFD mode) with live Elite Server Status, Galaxy BGS Tick, Landing Pad bay locator & TTS guidance, contextual Mini-HUD, and 1-click EDSY / Coriolis ship loadout export.
          - **COVAS AI Copilot (Streaming, ReAct & Voice Macros):** Real-time SSE sentence-by-sentence streaming + persistent warm Piper Neural TTS daemon, configurable Thinking Mode (`no`/`auto`/`yes`), 2-step read-only `[[QUERY]]` analytics, instant zero-LLM Voice Macros, zero-token tactical announcements in all 6 languages, global Push-to-Talk hotkey, Wake Word, persistent memory, and voice timers.
          - **Exploration, Exobiology & Surface Compass:** Live spherical surface compass tape with 1-click Last Exo Sample targeting, FSS/DSS body table with Universal Cartographics & Odyssey exobiology predictions, and historical Journal expedition analytics with Markdown export.
          - **Engineering Wishlist, Cargo & Shipyard:** Curated ship & Odyssey engineering wishlist with live missing-material tracking, instant docked cargo sell-value & colonisation cross-reference, automatic EDSM Shipyard fallback, and official multilingual module names across all 6 languages.
          - **Fleet Carrier, Spansh & GalNet:** Live carrier jump countdown with TTS warnings and financial runway, mass-aware tritium calculator, Spansh route/trade/mining/services/colonisation tools, and multi-language GalNet reader.
          - **Frontier cAPI & Community Sync:** Official Frontier Companion API (OAuth 2.0 + PKCE + DPAPI encrypted tokens) plus opt-in EDDN, EDSM, and Inara sync.
          - **6 Languages (English Default):** English (`en-GB`, default), Spanish (`es-ES`), French (`fr-FR`), German (`de-DE`), Russian (`ru-RU`), and Portuguese (`pt-BR`).

          ### Downloads
          - **Windows Installer (`HUDnopy-__TAG__-Setup.exe`):** Per-user installer (no admin prompt required) with Start Menu and optional Desktop shortcuts.
          - **Portable Archive (`HUDnopy-__TAG__-win-x64-portable.zip`):** Self-contained archive; extract anywhere and run `HUDnopy.exe` (no separate .NET runtime required).
          - **Checksums (`SHA256SUMS.txt`):** SHA-256 verification hashes for all release binaries.

          > **Windows SmartScreen Note:** As this is an unsigned open-source release, Windows SmartScreen may show a warning on first launch (*More info → Run anyway*).
          '@

          $notes = $notes.Replace('__BANNER__', $prereleaseBanner).Replace('__TAG__', $tag)
          $notes | Out-File -FilePath "release-notes.md" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HUDnopy ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: |
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip
            dist/SHA256SUMS.txt
