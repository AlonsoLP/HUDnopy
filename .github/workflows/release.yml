name: Build and Release HUDnopy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true
        default: 'v0.4.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $version = $tag.TrimStart('v')
          $isPrerelease = ($version -match '-').ToString().ToLowerInvariant()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building HUDnopy tag=$tag version=$version prerelease=$isPrerelease"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check Web HUD & Docs JavaScript syntax
        shell: pwsh
        run: |
          node --check Web/app.js
          node --check docs/i18n.js
          node --check docs/app.js

      - name: Run HUDnopy automated tests
        shell: pwsh
        run: dotnet run --project HUDnopy.Tests/HUDnopy.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 binary
        shell: pwsh
        run: |
          dotnet publish HUDnopy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:InformationalVersion=${{ steps.meta.outputs.version }} `
            -o publish/win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zipPath -Force

      - name: Ensure Inno Setup 6 is available and build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.meta.outputs.version }}" `
            "/DMyAppTag=${{ steps.meta.outputs.tag }}" `
            "/DPublishDir=..\publish\win-x64" `
            "installer\HUDnopy.iss"
          Copy-Item "installer\Output\HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe" "dist\" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist\*" -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $prereleaseBanner = ""
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            $prereleaseBanner = @'
          > [!WARNING]
          > **Pre-release Notice:** This is an early testing build (`__TAG__`) under active development and is **not yet a final stable release**. Features, configuration formats, and UI layouts may change in upcoming updates. Bug reports and feedback are greatly appreciated!

          '@
          }

          $notes = @'
          ## HUDnopy __TAG__ — Touch-First Cockpit UI, Adaptive Layouts & Full Parity

          __BANNER__### Highlights
          - **Icon-Only Sub-Tabs & Action Toolbars:** Compact icon sub-tabs with right-aligned active section titles and localized hover tooltips across Desktop WPF and Web HUD, plus numbered (`1`, `2`, `3`, …) Control Deck category tabs.
          - **Font-Scale-Aware Adaptive 2↔1 Column Layouts:** Automatic 2-column ↔ 1-column reflow across Dashboard, 8 telemetry sub-sections, and Settings — scaling seamlessly with `DesktopFontScalePercent` (`70%`–`200%`) on Desktop and `rem`-based CSS Grid on mobile/tablet/landscape screens in Web HUD.
          - **100% Desktop ↔ Web Feature Parity:** Added historical Journal viewer, CSV/JSON/Markdown exports, expedition analytics, Spansh CSV import & auto-copy, Material wishlist toggles, Hands-Free AI toggle, and Auto-Context Control Deck toggle to the Web HUD; removed legacy Split MFD dead code.
          - **Touch-First Settings Overhaul:** Custom 24px-knob cockpit sliders, `−`/`+` touch steppers on numeric fields, instant auto-save across Theme HEX colors, Game Paths/Controls, AI Copilot, and Alert Thresholds, collapsible Integration cards, and a 4-category zebra-striped Alert matrix.
          - **Strict Input Validation (`InputConstraint` + Web sanitizer):** Blocks invalid characters on typing, paste, drag-drop, and mobile/touch keyboards across all numeric, coordinate, HEX color, URL, and API key fields.
          - **Theme-Matched QR Pairing & About Tab:** Dark-cockpit QR code tinted with the active HUD accent color (with automatic contrast boost), a new **Settings → About (`ℹ️`)** tab with project and Elite Dangerous community links, unified project metadata in `HUDnopy.csproj`, and modularized `docs/` (`index.html`, `styles.css`, `i18n.js`, `app.js`).
          - **6 Languages (English Default) & CI:** English (`en-GB`, default), Spanish (`es-ES`), French (`fr-FR`), German (`de-DE`), Russian (`ru-RU`), and Portuguese (`pt-BR`) with 100% key and placeholder parity, verified by **30 automated CI test suites**.

          ### Bug Fixes
          - **DataGrid Vertical Scrolling:** Fixed global `DataGrid` style (`ScrollViewer.VerticalScrollBarVisibility="Auto"`) so `GridEngineers` and all other `MaxHeight`-bounded tables scroll smoothly instead of clipping rows.
          - **COVAS AI Material Grade Queries:** Extended material grade detection to all 5 grades (`G1`–`G5`) in both digits and words (e.g., *"grado tres"* / *"grade three"*) with average fill % and scarcity summary.
          - **COVAS AI Ship Lookup by Name:** Prioritized exact ship-name matching (stored and active ships, accent-insensitive) before falling back to the full fleet list (cap raised from 15 to 40 ships).

          ### Downloads
          - **Windows Installer (`HUDnopy-__TAG__-Setup.exe`):** Per-user installer (no admin prompt required) with Start Menu and optional Desktop shortcuts.
          - **Portable Archive (`HUDnopy-__TAG__-win-x64-portable.zip`):** Self-contained archive; extract anywhere and run `HUDnopy.exe` (no separate .NET runtime required).
          - **Checksums (`SHA256SUMS.txt`):** SHA-256 verification hashes for all release binaries.

          > **Windows SmartScreen Note:** As this is an unsigned open-source release, Windows SmartScreen may show a warning on first launch (*More info → Run anyway*).
          '@

          $notes = $notes.Replace('__BANNER__', $prereleaseBanner).Replace('__TAG__', $tag)
          $notes | Out-File -FilePath "release-notes.md" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HUDnopy ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip
            dist/SHA256SUMS.txt
