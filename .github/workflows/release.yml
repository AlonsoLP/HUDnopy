name: Build and Release HUDnopy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.3.0)'
        required: true
        default: 'v0.3.0'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve version metadata
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ github.event.inputs.tag }}"
          } else {
            $tag = "${{ github.ref_name }}"
          }
          $version = $tag.TrimStart('v')
          $isPrerelease = ($version -match '-').ToString().ToLowerInvariant()
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building HUDnopy tag=$tag version=$version prerelease=$isPrerelease"

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Check Web HUD JavaScript syntax
        shell: pwsh
        run: node --check Web/app.js

      - name: Run HUDnopy automated tests
        shell: pwsh
        run: dotnet run --project HUDnopy.Tests/HUDnopy.Tests.csproj -c Release

      - name: Publish self-contained Windows x64 binary
        shell: pwsh
        run: |
          dotnet publish HUDnopy.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:Version=${{ steps.meta.outputs.version }} `
            -p:InformationalVersion=${{ steps.meta.outputs.version }} `
            -o publish/win-x64

      - name: Package portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip"
          Compress-Archive -Path "publish/win-x64/*" -DestinationPath $zipPath -Force

      - name: Ensure Inno Setup 6 is available and build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc `
            "/DMyAppVersion=${{ steps.meta.outputs.version }}" `
            "/DMyAppTag=${{ steps.meta.outputs.tag }}" `
            "/DPublishDir=..\publish\win-x64" `
            "installer\HUDnopy.iss"
          Copy-Item "installer\Output\HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe" "dist\" -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem "dist\*" -File | Sort-Object Name
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($f.Name)"
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii

      - name: Prepare release notes
        shell: pwsh
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $prereleaseBanner = ""
          if ("${{ steps.meta.outputs.prerelease }}" -eq "true") {
            $prereleaseBanner = @'
          > [!WARNING]
          > **Pre-release Notice:** This is an early testing build (`__TAG__`) under active development and is **not yet a final stable release**. Features, configuration formats, and UI layouts may change in upcoming updates. Bug reports and feedback are greatly appreciated!

          '@
          }

          $notes = @'
          ## HUDnopy __TAG__

          __BANNER__### Highlights
          - **Expanded External Integrations (Strict Opt-In):** Added **Discord** (contextual Rich Presence via async Named Pipe IPC + Webhook embeds for ELW, 3/3 Exobiology, Carrier jumps with `<t:UNIX:R>` countdowns, BGS conflicts, ship builds, and cockpit screenshots), **EliteBGS v5** faction watchlist, **Ardent Insight** live commodity markets, **EDAstro DSSA** nearest carrier finder, **Canonn R&D** scientific telemetry, **Frontier cAPI** Fleet Carrier services/bartender/journal summary, **EDSM** live discovery/traffic/PvP intel, **Inara** profile card, and SHA-256 deduplicated **EDDN** uploads.
          - **COVAS AI Copilot Upgrades:** Added **Multimodal Cockpit Screen Vision** (Desktop & Web HUD), instant **zero-LLM cockpit telemetry queries**, Levenshtein fuzzy voice macros, adaptive noise-floor + ZCR VAD with sustained-voice barge-in, 18 s hands-free follow-up window, 60 s query caching, new `[[QUERY]]`/`[[ACTION]]` tags (including Discord sharing), and parallel Piper Neural TTS sentence pre-synthesis.
          - **Modern .NET 10 / C# 14 & NAudio 3.3 Audio Engine:** Upgraded to **NAudio 3.3.0** with shared-mode `WasapiPlayer` (automatic Windows default-device routing + `IAudioClient3` low latency), `EffectChain` (`GateEffect` + `CompressorEffect`) voice conditioning, and automatic microphone hot-swap reconnection. Pre-compressed Brotli/GZip Web HUD assets, per-socket parallel WebSocket broadcasts, parallel historical Journal analytics with SIMD `SearchValues`, `PeriodicTimer`, `FrozenDictionary`/`FrozenSet`, and source-generated `AppConfig` JSON.
          - **Diagnostics, Privacy-Safe Support ZIP & 30 Automated Test Suites:** Added daily rolling diagnostic logs (`%LocalAppData%\HUDnopy\logs\`), 40-entry in-memory breadcrumbs, Web HUD JS error reporting, global Kestrel HTTP 500 logging, and 1-click **📦 Export Support ZIP** with strict allowlist sanitization (API keys, tokens, webhooks, commander names, notes, memories, and Windows usernames are automatically removed). Verified by **30 automated regression, contract, fuzzing, property-based, concurrency, and security test suites**.
          - **6 Languages (English Default):** English (`en-GB`, default), Spanish (`es-ES`), French (`fr-FR`), German (`de-DE`), Russian (`ru-RU`), and Portuguese (`pt-BR`) with 100% key and placeholder parity.

          ### Downloads
          - **Windows Installer (`HUDnopy-__TAG__-Setup.exe`):** Per-user installer (no admin prompt required) with Start Menu and optional Desktop shortcuts.
          - **Portable Archive (`HUDnopy-__TAG__-win-x64-portable.zip`):** Self-contained archive; extract anywhere and run `HUDnopy.exe` (no separate .NET runtime required).
          - **Checksums (`SHA256SUMS.txt`):** SHA-256 verification hashes for all release binaries.

          > **Windows SmartScreen Note:** As this is an unsigned open-source release, Windows SmartScreen may show a warning on first launch (*More info → Run anyway*).
          '@

          $notes = $notes.Replace('__BANNER__', $prereleaseBanner).Replace('__TAG__', $tag)
          $notes | Out-File -FilePath "release-notes.md" -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HUDnopy ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-Setup.exe
            dist/HUDnopy-${{ steps.meta.outputs.tag }}-win-x64-portable.zip
            dist/SHA256SUMS.txt
