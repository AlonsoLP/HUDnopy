# Description: Automatically synchronizes the wiki/ folder to the GitHub Wiki
#              repository whenever wiki/*.md changes on main or on manual dispatch.
# -----------------------------------------------------------------------------

name: Sync GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Clone GitHub Wiki repository
        run: |
          git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git" wiki-repo

      - name: Copy markdown pages and push if changed
        run: |
          cp -f wiki/*.md wiki-repo/
          # GitHub Wiki renders internal links without the .md extension; keep .md in repo and strip on sync
          sed -i -E 's/\]\(([A-Za-z0-9_-]+)\.md\)/](\1)/g' wiki-repo/*.md
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is already up to date."
          else
            git commit -m "Sync wiki from ${{ github.sha }}"
            git push
          fi
