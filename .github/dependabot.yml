version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Keep System.Speech on .NET 10 LTS (10.x) until HUDnopy targets .NET 11+
      - dependency-name: "System.Speech"
        update-types: ["version-update:semver-major"]
